<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DevDice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 DevDice</h1>
        <p class="subtitle">Why isn't it working? Roll the dice.</p>
        
        <div id="excuseBox" class="excuse-box">
            <p id="excuseText">Click the button to generate an excuse...</p>
        </div>

        <button id="rollBtn">Generate Excuse</button>
        <p id="copyConfirmation"></p>
        
        <p class="hint">(Click the excuse to copy it)</p>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
